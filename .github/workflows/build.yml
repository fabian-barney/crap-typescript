name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: build / build-${{ matrix.os }}-${{ matrix.node }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-latest
            node: node22
            node-version: "22.13.0"
          - os: windows
            runner: windows-latest
            node: node24
            node-version: "24.0.0"
          - os: macos
            runner: macos-latest
            node: node22
            node-version: "22.13.0"
          - os: macos
            runner: macos-latest
            node: node24
            node-version: "24.0.0"
          - os: ubuntu
            runner: ubuntu-latest
            node: node22
            node-version: "22.13.0"
          - os: ubuntu
            runner: ubuntu-latest
            node: node24
            node-version: "24.0.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Set up npm 11.15.0
        run: npm install --global npm@11.15.0

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  test-unit:
    name: test / test-unit-${{ matrix.os }}-${{ matrix.node }}
    needs:
      - build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-latest
            node: node22
            node-version: "22.13.0"
          - os: windows
            runner: windows-latest
            node: node24
            node-version: "24.0.0"
          - os: macos
            runner: macos-latest
            node: node22
            node-version: "22.13.0"
          - os: macos
            runner: macos-latest
            node: node24
            node-version: "24.0.0"
          - os: ubuntu
            runner: ubuntu-latest
            node: node22
            node-version: "22.13.0"
          - os: ubuntu
            runner: ubuntu-latest
            node: node24
            node-version: "24.0.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Set up npm 11.15.0
        run: npm install --global npm@11.15.0

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run unit tests
        run: npm test

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.runner }}-${{ matrix.node-version }}
          path: coverage
          if-no-files-found: error

  lint:
    name: verify / lint
    runs-on: ubuntu-latest
    needs:
      - workspace-packages

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 24.0.0
        uses: actions/setup-node@v6
        with:
          node-version: 24.0.0
          cache: npm

      - name: Set up npm 11.15.0
        run: npm install --global npm@11.15.0

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  workspace-packages:
    name: package / workspace-packages
    runs-on: ubuntu-latest
    needs:
      - test-unit

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 24.0.0
        uses: actions/setup-node@v6
        with:
          node-version: 24.0.0
          cache: npm

      - name: Set up npm 11.15.0
        run: npm install --global npm@11.15.0

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify workspace packages
        run: npm pack --workspaces

  quality-crap:
    name: verify / quality-crap
    runs-on: ubuntu-latest
    needs:
      - workspace-packages

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 24.0.0
        uses: actions/setup-node@v6
        with:
          node-version: 24.0.0
          cache: npm

      - name: Set up npm 11.15.0
        run: npm install --global npm@11.15.0

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Download coverage
        uses: actions/download-artifact@v8
        with:
          name: coverage-ubuntu-latest-24.0.0
          path: coverage

      - name: Run crap-typescript gate
        run: npm run crap-typescript-check

  quality-cognitive:
    name: verify / quality-cognitive
    runs-on: ubuntu-latest
    needs:
      - workspace-packages

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 24.0.0
        uses: actions/setup-node@v6
        with:
          node-version: 24.0.0
          cache: npm

      - name: Set up npm 11.15.0
        run: npm install --global npm@11.15.0

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run cognitive-typescript gate
        run: npm run cognitive-typescript-check
