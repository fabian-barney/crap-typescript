name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  candidate:
    name: Validate Release Candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    outputs:
      release: ${{ steps.candidate.outputs.release }}
      version: ${{ steps.candidate.outputs.version }}
      tag: ${{ steps.candidate.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Detect and validate version bump
        id: candidate
        run: node scripts/release-candidate.mjs validate
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Wait for exact-commit CI
        if: steps.candidate.outputs.release == 'true'
        run: node scripts/release-candidate.mjs wait
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    name: Publish Release
    needs: candidate
    if: needs.candidate.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_VERSION: ${{ needs.candidate.outputs.version }}
      RELEASE_TAG: ${{ needs.candidate.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Install pinned npm
        run: npm install --global npm@11.15.0
      - run: npm ci
      - run: npm run verify-release-version -- "$RELEASE_TAG"
      - run: npm run build
      - run: npm run release:artifacts
      - name: Render notes
        run: node scripts/render-release-notes.mjs "$RELEASE_TAG" > release-notes.md
      - name: Attest release archives, SBOMs, and checksums
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release-artifacts/*.tgz
            release-artifacts/*.cdx.json
            release-artifacts/SHA256SUMS
      - name: Attest core SBOM
        id: sbom-core
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-artifacts/barney-media-crap-typescript-core-${{ env.RELEASE_VERSION }}.tgz
          sbom-path: release-artifacts/barney-media-crap-typescript-core-${{ env.RELEASE_VERSION }}.tgz.cdx.json
      - name: Attest cli SBOM
        id: sbom-cli
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-artifacts/barney-media-crap-typescript-${{ env.RELEASE_VERSION }}.tgz
          sbom-path: release-artifacts/barney-media-crap-typescript-${{ env.RELEASE_VERSION }}.tgz.cdx.json
      - name: Attest vitest SBOM
        id: sbom-vitest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-artifacts/barney-media-crap-typescript-vitest-${{ env.RELEASE_VERSION }}.tgz
          sbom-path: release-artifacts/barney-media-crap-typescript-vitest-${{ env.RELEASE_VERSION }}.tgz.cdx.json
      - name: Attest jest SBOM
        id: sbom-jest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-artifacts/barney-media-crap-typescript-jest-${{ env.RELEASE_VERSION }}.tgz
          sbom-path: release-artifacts/barney-media-crap-typescript-jest-${{ env.RELEASE_VERSION }}.tgz.cdx.json
      - name: Collect and verify signed bundles
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          CORE_BUNDLE: ${{ steps.sbom-core.outputs.bundle-path }}
          CLI_BUNDLE: ${{ steps.sbom-cli.outputs.bundle-path }}
          VITEST_BUNDLE: ${{ steps.sbom-vitest.outputs.bundle-path }}
          JEST_BUNDLE: ${{ steps.sbom-jest.outputs.bundle-path }}
        run: |
          cp "$PROVENANCE_BUNDLE" release-artifacts/provenance.sigstore.json
          cp "$CORE_BUNDLE" "release-artifacts/barney-media-crap-typescript-core-${RELEASE_VERSION}.tgz.sbom.sigstore.json"
          cp "$CLI_BUNDLE" "release-artifacts/barney-media-crap-typescript-${RELEASE_VERSION}.tgz.sbom.sigstore.json"
          cp "$VITEST_BUNDLE" "release-artifacts/barney-media-crap-typescript-vitest-${RELEASE_VERSION}.tgz.sbom.sigstore.json"
          cp "$JEST_BUNDLE" "release-artifacts/barney-media-crap-typescript-jest-${RELEASE_VERSION}.tgz.sbom.sigstore.json"
          bash scripts/verify-release-attestations.sh release-artifacts
      - name: Preserve validated release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ env.RELEASE_VERSION }}-${{ github.sha }}
          path: |
            release-artifacts/
            release-notes.md
          if-no-files-found: error
      - name: Create immutable tag and GitHub draft
        run: npm run release:publish -- prepare
      - name: Upload verified assets to draft
        run: gh release upload "$RELEASE_TAG" release-artifacts/*
      - name: Publish exact archives to npm
        run: npm run release:publish -- publish
      - name: Verify npm metadata and archive integrity
        run: npm run release:publish -- verify
      - name: Verify registry signatures and provenance
        run: npm run release:smoke -- --registry
      - name: Publish GitHub release
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
